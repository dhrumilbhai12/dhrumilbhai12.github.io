<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5bb5f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Backyard Blasters</title>
<style>
@font-face{font-family:'Lilita';src:url('assets/LilitaOne-Regular.ttf') format('truetype');font-display:block}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#5bb5f0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#rotate{display:none;position:fixed;inset:0;z-index:10;background:linear-gradient(#6cc4f5,#a8e06a);color:#fff;font-family:'Lilita',sans-serif;text-align:center;flex-direction:column;align-items:center;justify-content:center;font-size:28px;text-shadow:0 3px 0 #2a4a20,0 0 8px #0005}
#rotate .ph{width:70px;height:120px;border:6px solid #fff;border-radius:14px;margin-bottom:24px;animation:rot 1.8s ease-in-out infinite;box-shadow:0 4px 0 #2a4a20}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:28px sans-serif;color:#fff;background:#5bb5f0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rotate"><div class="ph"></div>Rotate your phone<br><span style="font-size:18px">Backyard Blasters plays in landscape</span></div>
<div id="loading">Loading…</div>
<script src="js/game.js?v=2b"></script>
</body>
</html>
