<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8ed5ee">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='18' width='54' height='30' rx='9' fill='%23b9522f' stroke='%2330383a' stroke-width='5'/%3E%3Ccircle cx='18' cy='48' r='7' fill='%2325292a'/%3E%3Ccircle cx='47' cy='48' r='7' fill='%2325292a'/%3E%3C/svg%3E">
  <title>Car Survivor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="coin-pill"><span class="coin-icon">◆</span><span id="coins">0</span></div>
    <div class="time-panel"><strong id="timer">00:00</strong><span id="day">DAY 1 · SURVIVE THE DAY</span></div>
    <div class="top-buttons"><button id="quality" aria-label="Quality">HIGH</button><button id="pause" aria-label="Pause">Ⅱ</button></div>
    <div id="combo"></div>
    <div class="health-shell"><div id="health"></div></div>
    <div id="joystick" aria-label="Drive joystick"><div class="joy-ring"><div class="joy-knob"></div></div></div>
    <div id="toast"></div>
  </div>
  <div id="overlay" class="hidden"><div class="card"><div class="eyebrow">CAR SURVIVOR</div><h1 id="overlay-title">PAUSED</h1><p id="overlay-copy">Take a breath. The infected are still out there.</p><div id="summary"></div><button id="resume">CONTINUE</button><button id="restart" class="secondary hidden">NEW RUN</button></div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
